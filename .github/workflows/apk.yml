# Construit l'application Android (APK) de Correcteur de Maths CSP/ASSO.
# Lance-le : onglet Actions > "Construire l'APK" > Run workflow (il se lance aussi quand index.html change).
# Résultat : onglet Releases > "Application Android" > correcteur-maths.apk
name: Construire l'APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Projet Capacitor
        run: |
          mkdir -p apk/www
          cd apk
          cp ../index.html www/index.html
          for f in manifest.json icon-192.png icon-512.png; do [ -f "../$f" ] && cp "../$f" www/ || true; done
          cat > package.json <<'JSON'
          {
            "name": "correcteur-maths-apk",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/core": "^6.0.0",
              "@capacitor/device": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "org.cspasso.correcteurmaths",
            "appName": "Correcteur de Maths CSP/ASSO",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          JSON
          npm install --no-audit --no-fund
          npx cap add android

      - name: Icône et caméra
        run: |
          cd apk
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import os, shutil
          from PIL import Image
          res = 'android/app/src/main/res'
          src = '../icon-512.png'
          if os.path.exists(src):
              im = Image.open(src).convert('RGBA')
              for d, n in (('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)):
                  for name in ('ic_launcher.png', 'ic_launcher_round.png'):
                      im.resize((n, n), Image.LANCZOS).save(os.path.join(res, 'mipmap-' + d, name))
              shutil.rmtree(os.path.join(res, 'mipmap-anydpi-v26'), ignore_errors=True)
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m, encoding='utf-8').read()
          if 'android.permission.CAMERA' not in s:
              s = s.replace('</manifest>', '    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>')
              open(m, 'w', encoding='utf-8').write(s)
          PY

      - name: Synchroniser
        run: cd apk && npx cap sync android

      - name: Clé de signature fixe (garde le même identifiant Android d'une version à l'autre)
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore

      - name: Compiler
        run: cd apk/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Nommer le fichier
        run: cp apk/android/app/build/outputs/apk/debug/app-debug.apk correcteur-maths.apk

      - uses: actions/upload-artifact@v4
        with:
          name: correcteur-maths-apk
          path: correcteur-maths.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Application Android
          body: Télécharge correcteur-maths.apk sur le téléphone de l'élève, puis ouvre-le pour l'installer.
          files: correcteur-maths.apk
