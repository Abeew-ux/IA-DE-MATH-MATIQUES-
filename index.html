<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Correcteur de Maths CSP/ASSO</title>
<meta name="theme-color" content="#1B3A8C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Source+Sans+3:wght@400;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout: une discussion plein écran. Le fil est une page de cahier Seyès, la saisie est collée en bas, la correction est au stylo rouge. */
:root{
  --paper:#F7F9FD; --grid:#E3EAF6; --grid-strong:#CBD8EE; --surface:#FFFFFF; --line:#C9D4E8;
  --ink:#16233F; --ink-soft:#4F5E7B; --pen:#C8202F; --pen-bg:#FDECEE;
  --ok:#17744C; --ok-bg:#E6F4EC; --warn:#A85F00; --warn-bg:#FBF0DD;
  --accent:#1B3A8C; --on-accent:#FFFFFF;
  --hand:'Kalam','Segoe Print','Bradley Hand',cursive;
  --body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --math:'STIX Two Text','Cambria Math','Times New Roman',serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F141D; --grid:#171F2C; --grid-strong:#212C3F; --surface:#161D2A; --line:#2B374C;
    --ink:#E8EDF8; --ink-soft:#9AA7C0; --pen:#FF7683; --pen-bg:#2B1A20;
    --ok:#56C995; --ok-bg:#15281F; --warn:#E9A94A; --warn-bg:#2B2213;
    --accent:#A9BDFF; --on-accent:#0D1324; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F141D; --grid:#171F2C; --grid-strong:#212C3F; --surface:#161D2A; --line:#2B374C;
  --ink:#E8EDF8; --ink-soft:#9AA7C0; --pen:#FF7683; --pen-bg:#2B1A20;
  --ok:#56C995; --ok-bg:#15281F; --warn:#E9A94A; --warn-bg:#2B2213;
  --accent:#A9BDFF; --on-accent:#0D1324; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
.app{height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;background:var(--paper)}
@media (min-width:721px){.app{border-inline:1px solid var(--line)}}

.bar{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:var(--gl);padding-right:var(--gr)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar h1{font:700 20px/1.25 var(--hand);margin:0;min-width:0;text-wrap:balance}
.bar h1 span{text-decoration:underline;text-decoration-color:var(--pen);text-decoration-thickness:3px;text-underline-offset:5px;text-decoration-skip-ink:none}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sub select{min-height:36px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:0 8px;font-weight:600}
.tg{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:600;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tg:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.avg{color:var(--ink-soft);font-size:14px;font-weight:600}
.app.locked .thread,.app.locked .composer,.app.locked .sub,.app.locked #fresh{display:none}
.login{flex:1;min-height:0;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding-block:20px;padding-left:var(--gl);padding-right:var(--gr);
  background-color:var(--paper);
  background-image:
    linear-gradient(to right,var(--grid-strong) 1px,transparent 1px),
    linear-gradient(to bottom,var(--grid-strong) 1px,transparent 1px),
    linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:32px 32px,100% 32px,100% 8px}
.login-card{width:100%;max-width:420px;margin:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.lt{font:700 26px/1.2 var(--hand);margin:0}
.lead{margin:0;color:var(--ink-soft)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-weight:700}
.fld input,.fld select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:0 12px;font-size:17px;color:var(--ink)}
.fld input:focus-visible,.fld select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.login-card .actions{display:flex;gap:10px;flex-wrap:wrap}
.login-card .btn{min-height:48px;font-size:16px}
.login-card .btn.pri{flex:1 1 160px}
.sys p{margin:0}
.btn{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:focus-visible,.ib:focus-visible,select:focus-visible,summary:focus-visible,.cb:focus-visible,textarea:focus-visible{outline:3px solid var(--pen);outline-offset:2px}

.thread{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px;padding-block:16px;padding-left:var(--gl);padding-right:var(--gr);
  background-color:var(--paper);
  background-image:
    linear-gradient(to right,var(--grid-strong) 1px,transparent 1px),
    linear-gradient(to bottom,var(--grid-strong) 1px,transparent 1px),
    linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:32px 32px,100% 32px,100% 8px;background-attachment:local}
.msg{min-width:0}
.usr{align-self:flex-end;max-width:88%;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:16px 16px 4px 16px;display:flex;flex-direction:column;gap:8px}
.usr p{margin:0;font:400 18px/1.45 var(--math);white-space:pre-wrap;overflow-wrap:anywhere}
.usr .phn{font:600 14px/1.3 var(--body);opacity:.9}
.ph{display:flex;gap:6px;flex-wrap:wrap}
.ph img{width:96px;height:96px;object-fit:cover;border-radius:10px;display:block}
.bot{align-self:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:14px;display:flex;flex-direction:column;gap:14px}
.t-chat{align-self:flex-start;max-width:94%}
.bot p{margin:0}
.chat-t{font:400 18px/1.55 var(--math);white-space:pre-wrap;overflow-wrap:anywhere}
.sys{align-self:flex-start;max-width:94%;border-radius:14px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sys.err{background:var(--pen-bg);border-color:transparent;color:var(--pen);font-weight:600}
.sys.wait{flex-direction:row;align-items:center;gap:10px;color:var(--ink-soft);font-weight:600}
.dots{width:18px;height:18px;border-radius:50%;border:3px solid var(--grid-strong);border-top-color:var(--pen);animation:spin 1s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.dots{animation:none;border-top-color:var(--grid-strong);border-right-color:var(--pen)}.chev{transition:none!important}}

h2{font:700 13px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec-h .btn{min-height:36px;padding:0 12px;font-size:14px}
.read{border:1px dashed var(--line);border-radius:10px;padding:8px 12px;background:var(--paper)}
.read h2{margin-bottom:2px}
.read p{font:400 18px/1.5 var(--math);overflow-wrap:anywhere}
.res{background:var(--ok-bg);border-radius:12px;padding:12px 14px}
.res h2{color:var(--ok);margin-bottom:4px}
.res p{font:600 22px/1.4 var(--math);overflow-wrap:anywhere}
.stps{display:flex;flex-direction:column;gap:8px}
details.stp{border:1px solid var(--line);border-radius:10px;background:var(--paper)}
details.stp>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) 14px;gap:10px;align-items:center;padding:10px 12px;min-height:48px}
details.stp>summary::-webkit-details-marker{display:none}
.badge{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 14px/1 var(--body)}
.sm{display:flex;flex-direction:column;min-width:0}
.ttl{font:600 13px/1.3 var(--body);color:var(--ink-soft)}
.calc{font:400 18px/1.4 var(--math);overflow-wrap:anywhere}
.chev{width:9px;height:9px;border-right:2px solid var(--ink-soft);border-bottom:2px solid var(--ink-soft);transform:rotate(45deg);transition:transform .15s}
details[open]>summary .chev{transform:rotate(-135deg)}
.why{padding:0 12px 12px 50px}
.remark{font:400 18px/1.5 var(--hand);color:var(--pen)}

.res-head{display:flex;gap:14px;align-items:center;justify-content:space-between}
.res-meta{min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.verdict{display:inline-flex;padding:4px 12px;border-radius:999px;font-weight:700;font-size:14px}
.v-correct{background:var(--ok-bg);color:var(--ok)}
.v-partiel{background:var(--warn-bg);color:var(--warn)}
.v-incorrect,.v-vide{background:var(--pen-bg);color:var(--pen)}
.jn{color:var(--ink-soft);font-size:15px}
.stamp{flex:0 0 auto;width:88px;height:88px;border:3px solid var(--pen);border-radius:50%;display:flex;align-items:baseline;justify-content:center;gap:1px;padding-top:24px;color:var(--pen);font-family:var(--hand);font-weight:700;transform:rotate(-6deg)}
.stamp .n{font-size:32px;line-height:1}
.stamp .d{font-size:15px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;margin-top:2px}
.s-ok .mark{background:var(--ok-bg);color:var(--ok)}
.s-erreur .mark{background:var(--pen-bg);color:var(--pen)}
.s-incomplet .mark{background:var(--warn-bg);color:var(--warn)}
.line{font:400 18px/1.5 var(--math);overflow-wrap:anywhere}
.note{font:400 16px/1.45 var(--hand);color:var(--ink-soft);margin-top:2px!important}
.s-erreur .note,.s-incomplet .note{color:var(--pen)}
.fix{margin-top:8px!important;padding:8px 12px;background:var(--ok-bg);border-radius:8px;font:400 18px/1.5 var(--math);overflow-wrap:anywhere}
.fix b{font:700 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ok);margin-right:8px}
details.sol>summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
details.sol ol{margin:6px 0 0;padding-left:26px;font:400 18px/1.6 var(--math)}
details.sol li{padding-left:4px;margin-bottom:6px;overflow-wrap:anywhere}
.final{margin-top:12px!important;padding:10px 12px;background:var(--ok-bg);border-radius:8px;font:600 18px/1.5 var(--math);overflow-wrap:anywhere}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tips li::marker{color:var(--pen)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.cb{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:600;text-align:left}
.welcome p{font-size:17px}

.composer{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);padding-block:8px;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:flex-end;gap:8px}
.ib{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0}
.ib.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ib:disabled{opacity:.5;cursor:default}
.ib .rt{font:400 17px/1 var(--math)}
.ib[aria-expanded="true"]{background:var(--grid);}
.composer textarea{flex:1;min-width:0;min-height:44px;max-height:140px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:9px 12px;font:400 18px/1.4 var(--math);resize:none;color:var(--ink)}
.composer textarea::placeholder{color:var(--ink-soft);opacity:.8}
.sym{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.sym button{flex:0 0 auto;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font:400 20px/1 var(--math);cursor:pointer}
.pending{display:flex;gap:10px;flex-wrap:wrap;padding-top:6px}
.thumb{position:relative;width:60px;height:60px}
.thumb img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.thumb button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;line-height:1;font-size:16px;padding:0}
.hint{margin:0;color:var(--pen);font-size:14px;font-weight:600}
.hint:empty{display:none}
</style>

</head>
<body>
<div class="app">
  <header class="bar">
    <div class="top">
      <h1><span>Correcteur de Maths CSP/ASSO</span></h1>
      <button type="button" class="btn" id="fresh">Nouveau</button>
    </div>
    <div class="sub">
      <button type="button" class="tg" id="profile" aria-label="Changer de nom ou de classe" title="Changer de nom ou de classe"></button>
      <button type="button" class="tg" id="precise" aria-pressed="false" title="Réflexion plus longue, réponses plus fiables">Mode précis</button>
      <span class="avg" id="avg" hidden></span>
    </div>
  </header>

  <section class="login" id="login" hidden aria-labelledby="login-t">
    <form class="login-card" id="login-form" autocomplete="off" novalidate>
      <h2 class="lt" id="login-t" style="text-transform:none;letter-spacing:0;color:var(--ink)">Bienvenue !</h2>
      <p class="lead">Dis-moi qui tu es pour que je m'adapte à ta classe. Ces informations restent sur ton téléphone.</p>
      <div class="fld">
        <label for="p-nom">Ton nom</label>
        <input id="p-nom" type="text" maxlength="40" autocomplete="name" placeholder="Prénom et nom">
      </div>
      <div class="fld">
        <label for="p-classe">Ta classe</label>
        <select id="p-classe">
          <option value="">Choisis ta classe</option>
          <option value="6e">6e</option>
          <option value="5e">5e</option>
          <option value="4e">4e</option>
          <option value="3e">3e</option>
          <option value="2nde">2nde</option>
          <option value="1ère">1ère</option>
          <option value="Terminale">Terminale</option>
          <option value="Supérieur">Supérieur</option>
          <option value="Autre">Autre</option>
        </select>
      </div>
      <div class="fld" id="p-autre-w" hidden>
        <label for="p-autre">Précise ta classe</label>
        <input id="p-autre" type="text" maxlength="30" placeholder="Ex. Terminale D">
      </div>
      <p class="hint" id="p-err" role="alert"></p>
      <div class="actions">
        <button type="submit" class="btn pri" id="p-ok">Commencer</button>
        <button type="button" class="btn" id="p-cancel" hidden>Annuler</button>
      </div>
    </form>
  </section>

  <main class="thread" id="thread" role="log" aria-live="polite" aria-label="Discussion"></main>

  <form class="composer" id="composer" autocomplete="off">
    <div class="pending" id="pending" hidden></div>
    <p class="hint" id="hint" role="status"></p>
    <div class="sym" id="sym" hidden aria-label="Symboles mathématiques"></div>
    <div class="row">
      <button type="button" class="ib" id="photo" aria-label="Joindre une photo" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <button type="button" class="ib" id="symtog" aria-label="Symboles mathématiques" aria-expanded="false"><span class="rt" aria-hidden="true">√x</span></button>
      <textarea id="msg" rows="1" placeholder="Écris un exercice ou pose une question" enterkeyhint="send"></textarea>
      <button type="submit" class="ib go" id="send" aria-label="Envoyer">
        <svg class="ic-send" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        <svg class="ic-stop" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" hidden><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
      </button>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </form>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  function h(tag, props) {

  function fmt(n) { return String(n).replace('.', ','); }

  /*ADAPTER_START*/

  var BACKEND_URL = 'https://REMPLACE-MOI.workers.dev';
  var APP_CODE = '';
  var imgLimits = { maxCount: 4, maxInputBytes: 20000000, mediaTypes: ['image/jpeg', 'image/png', 'image/webp', 'image/gif'] };
  var ready = Promise.resolve();

  async function prep(blob) {
    var bmp;
    try { bmp = await createImageBitmap(blob); } catch (e) { throw { code: 'image_rejected', message: 'decode' }; }
    var k = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    var out = await new Promise(function (r) { c.toBlob(r, 'image/jpeg', 0.85); });
    if (!out) throw { code: 'image_rejected', message: 'encode' };
    var data = await new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res(String(fr.result).split(',')[1]); };
      fr.onerror = rej; fr.readAsDataURL(out);
    });
    return { media_type: 'image/jpeg', data: data };
  }
  function parseJson(text) {
    var t = String(text || '').trim();
    try { return JSON.parse(t); } catch (e) {}
    var f = t.match(/```(?:json)?\s*([\s\S]*?)```/);
    if (f) { try { return JSON.parse(f[1]); } catch (e) {} }
    var a = t.indexOf('{'), z = t.lastIndexOf('}');
    if (a >= 0 && z > a) { try { return JSON.parse(t.slice(a, z + 1)); } catch (e) {} }
    throw { code: 'invalid_json', message: 'no json', text: t };
  }
  var llm = async function (turns, o) {
    var images = (o.images && o.images.length) ? await Promise.all(o.images.map(prep)) : [];
    var res;
    try {
      var headers = { 'content-type': 'application/json' };
      if (APP_CODE) headers['x-app-code'] = APP_CODE;
      res = await fetch(BACKEND_URL.replace(/\/$/, '') + '/chat', { method: 'POST', headers: headers, body: JSON.stringify({ turns: turns, images: images, tier: o.tier || 'default' }), signal: o.signal });
    } catch (e) {
      if (e && e.name === 'AbortError') throw { code: 'cancelled', message: 'abort' };
      throw { code: 'upstream_error', message: String(e) };

    if (!res.ok) {
      var code = res.status === 429 ? 'rate_limited' : (res.status === 401 || res.status === 403) ? 'sampling_disabled' : res.status === 413 ? 'prompt_too_large' : 'upstream_error';
      throw { code: code, message: 'http ' + res.status };
    }
    var j = await res.json();
    return parseJson(j && j.text);
  };
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {

        etapes: arr(d.etapes).map(function (e) { e = e || {}; return { titre: s(e.titre), calcul: s(e.calcul), explication: s(e.explication) }; }).filter(function (e) { return e.calcul || e.explication; }) };

  });

  /* ---------- photos ---------- */
  ready.then(function () {
    if (imgLimits) {
      $('photo').hidden = false;
      if (imgLimits.mediaTypes && imgLimits.mediaTypes.length) $('file').accept = imgLimits.mediaTypes.join(',');
    }
    if (!llm) { $('send').disabled = true; $('msg').disabled = true; $('msg').placeholder = 'Indisponible ici'; thread.append(h('div', { class: 'msg sys err' }, "La correction par IA n'est pas disponible ici. Ouvre cette page dans l'application Claude, connecté à ton compte.")); }
  });
  $('photo').addEventListener('click', function () { $('file').value = ''; $('file').click(); });
  $('file').addEventListener('change', function () {
    var max = imgLimits ? imgLimits.maxCount : 4;
    Array.prototype.slice.call($('file').files || []).forEach(function (f) {
      if (pending.length >= max) { hint('Tu peux joindre ' + max + ' photos au maximum.'); return; }
      if (imgLimits && imgLimits.maxInputBytes && f.size > imgLimits.maxInputBytes) { hint('Cette photo est trop lourde. Choisis-en une plus légère.'); return; }
      pending.push({ blob: f, url: URL.createObjectURL(f) });
    });
    renderPending();
  });
  function renderPending() {
    var box = $('pending'); box.replaceChildren(); box.hidden = !pending.length;
    pending.forEach(function (p) {
      box.append(h('div', { class: 'thumb' }, h('img', { src: p.url, alt: 'Photo jointe' }),
        h('button', { type: 'button', 'aria-label': 'Retirer cette photo', onclick: function () { URL.revokeObjectURL(p.url); pending.splice(pending.indexOf(p), 1); renderPending(); } }, '×')));
    });
  }

  /* ---------- nouvelle discussion ---------- */
  var armed = null;
  $('fresh').addEventListener('click', function () {
    var b = $('fresh');
    if (conv.length && !armed) { b.textContent = 'Effacer ?'; armed = setTimeout(function () { armed = null; b.textContent = 'Nouveau'; }, 3000); return; }
    clearTimeout(armed); armed = null; b.textContent = 'Nouveau';
    resetConversation();
  });

  /* ---------- démarrage ---------- */
  var saved = store.get(CKEY);
  if (Array.isArray(saved) && saved.length) {
    saved.forEach(function (e) {
      if (e && e.role === 'user') { conv.push({ role: 'user', text: e.text || '', photos: e.photos || 0 }); addUser(conv[conv.length - 1]); }
      else if (e && e.role === 'assistant' && e.data) { var d = norm(e.data); conv.push({ role: 'assistant', data: d }); addBot(d, false); }
    });
    toBottom(); updateAvg();
  } else { addWelcome(); }
  if (profile) updateProfileBtn(); else showLogin(false);
})();
</script>
</body>
</html>
